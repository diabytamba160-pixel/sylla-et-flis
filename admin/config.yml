
backend:
  name: github
  repo: diabytamba160-pixel /sylla-et-flis
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "produits"
    label: "Produits"
    folder: "_produits"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom du produit", name: "title", widget: "string" }
      - { label: "Prix en FCFA", name: "prix", widget: "number", value_type: "int" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text", required: false }
