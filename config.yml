backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "produits"
    label: "Produits"
    folder: "_produits"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nom du produit", name: "title", widget: "string"}
      - {label: "Prix (FCFA)", name: "price", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Image du produit", name: "image", widget: "image"}
      - {label: "Numéro WhatsApp (ex: 22376219117)", name: "phone", widget: "string"}
